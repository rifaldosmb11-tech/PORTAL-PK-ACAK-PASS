<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genjutsu System ULTIMATE PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
/* ================= RESET & BASE ================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    background-color: #05050a;
}

/* BACKGROUND VIDEO */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    z-index: -1;
    transform: translate(-50%, -50%);
    object-fit: cover;
}

/* CYBER OVERLAY GRID */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(circle at 50% 50%, rgba(255, 0, 100, 0.12), rgba(5, 5, 10, 0.85)),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    z-index: 0;
}

/* ================= RAIN CANVAS ================= */
#rain-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
}

/* ================= LIGHTNING EFFECT ================= */
#lightning-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 0, 128, 0.3) 50%, transparent 100%);
    opacity: 0;
    transition: opacity 0.05s ease;
}

.lightning-bolt {
    position: absolute;
    top: 0;
    width: 3px;
    height: 100vh;
    background: #fff;
    box-shadow: 0 0 20px #ff0077, 0 0 40px #ffffff, 0 0 60px #00f0ff;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
}

/* ================= COPYRIGHT FOOTER ================= */
.copyright-footer {
    position: fixed;
    bottom: 15px;
    right: 20px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 1px;
    z-index: 99;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    pointer-events: none;
    user-select: none;
}

/* ================= PARTICLE SYSTEM ================= */
#particle-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #00f0ff;
    border-radius: 50%;
    box-shadow: 0 0 12px #00f0ff, 0 0 20px #ff0077;
    animation: float 5s linear infinite;
}

@keyframes float {
    from { transform: translateY(105vh) scale(0.8); opacity: 0; }
    50% { opacity: 1; }
    to { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ================= SHARINGAN & SWORD SLASH EFFECTS ================= */
#sharingan-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 260px;
    height: 260px;
    transform: translate(-50%, -50%) scale(0) rotate(0deg);
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    filter: drop-shadow(0 0 35px #ff0055) drop-shadow(0 0 70px #00f0ff);
}

#sharingan-overlay.active-sharingan {
    transform: translate(-50%, -50%) scale(1.1) rotate(720deg);
    opacity: 1;
}

/* SWORD SLASH CONTAINER */
#sword-slash-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    overflow: hidden;
}

.sword-slash {
    position: absolute;
    top: 50%;
    left: -20%;
    width: 140%;
    height: 6px;
    background: linear-gradient(90deg, transparent, #ffffff, #00f0ff, #ff0077, transparent);
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff0077, 0 0 60px #ffffff;
    transform: translateY(-50%) rotate(-25deg) scaleX(0);
    transform-origin: left center;
    opacity: 0;
}

.sword-slash.animate-slash {
    animation: slashSlash 0.45s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes slashSlash {
    0% { transform: translateY(-50%) rotate(-25deg) scaleX(0); opacity: 1; }
    50% { transform: translateY(-50%) rotate(-25deg) scaleX(1); opacity: 1; }
    100% { transform: translateY(-50%) rotate(-25deg) scaleX(1); opacity: 0; }
}

/* ================= ANIMATED RGB COLORFUL BORDER CONTAINER ================= */
.amaterasu-container {
    position: relative;
    z-index: 10;
    width: 92%;
    max-width: 480px;
    padding: 6px;
    border-radius: 42px 12px 42px 12px;
    background: #000;
}

.amaterasu-container::before,
.amaterasu-container::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 46px 16px 46px 16px;
    background: linear-gradient(
        45deg,
        #ff0000,
        #ff7300,
        #fffb00,
        #48ff00,
        #00ffd5,
        #002bfd,
        #7a00ff,
        #ff00c8,
        #ff0000
    );
    background-size: 400% 400%;
    z-index: -1;
    animation: rgbRainbow 4s linear infinite;
}

.amaterasu-container::after {
    filter: blur(16px);
    opacity: 0.9;
    animation: rgbRainbow 4s linear infinite;
}

@keyframes rgbRainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    width: 100%;
    padding: 35px 25px;
    border-radius: 37px 7px 37px 7px;
    background: rgba(8, 8, 16, 0.92);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.card::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
    pointer-events: none;
}

/* HEADER BADGE */
.badge-tag {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.5);
    color: #00f0ff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
}

.header-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00f0ff, #ff0077, #fffb00);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 25px;
    animation: titleGlow 3s linear infinite;
}

@keyframes titleGlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

/* PREMIUM INPUT GROUP */
.input-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
}

.input-box {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(18, 18, 30, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 4px 6px 4px 16px;
    transition: all 0.3s ease;
}

.input-box:focus-within {
    border-color: #00f0ff;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.1);
    background: rgba(25, 15, 35, 0.9);
}

input {
    width: 100%;
    padding: 10px 0;
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.btn-copy {
    background: linear-gradient(135deg, #00f0ff, #7a00ff);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
}

.btn-copy:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0, 240, 255, 0.7);
    background: #00f0ff;
}

/* MAIN GENERATE BUTTON */
.btn-main {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(90deg, #ff0077, #7a00ff, #00f0ff, #ff0077);
    background-size: 300% auto;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 10px 30px rgba(255, 0, 119, 0.4);
    position: relative;
    overflow: hidden;
}

.btn-main:hover {
    background-position: right center;
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 15px 40px rgba(0, 240, 255, 0.7);
}

/* LOG DISPLAY BOX */
.log-box {
    margin-top: 22px;
    padding: 18px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.25);
    background: rgba(5, 5, 12, 0.6);
    text-align: left;
    position: relative;
}

#log-text {
    font-size: 12px;
    white-space: pre-wrap;
    color: #e0e0e0;
    line-height: 1.6;
    font-family: 'Consolas', monospace;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}

.btn-copy-all {
    margin-top: 14px;
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: #00f0ff;
    box-shadow: none;
}

.btn-copy-all:hover {
    background: #00f0ff;
    color: #000;
}

/* CROW SYSTEM */
#crow-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
}

.crow {
    position: absolute;
    width: 80px;
    height: 50px;
    opacity: 0.85;
    filter: drop-shadow(0 0 10px rgba(0,240,255,0.5));
}

.crow svg path {
    fill: #08080c;
    animation: wingFlap 0.3s infinite alternate;
    transform-origin: center;
}

@keyframes wingFlap {
    from { transform: scaleY(1); }
    to { transform: scaleY(0.55); }
}

@keyframes flyAcross {
    from { transform: translate3d(-150px, 0, 0); }
    to { transform: translate3d(calc(100vw + 150px), 20px, 0); }
}
</style>
</head>

<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="https://v1.pinimg.com/videos/iht/expMp4/v2/45/ba/25/45ba25c875abb28d759bc56a705d02c6_720w.mp4" type="video/mp4">
</video>

<canvas id="rain-canvas"></canvas>
<div id="lightning-flash"></div>
<div id="particle-container"></div>
<div id="crow-container"></div>
<div id="sword-slash-container"><div id="sword-slash" class="sword-slash"></div></div>

<svg id="sharingan-overlay" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="90" fill="#ff0055" stroke="#000" stroke-width="6"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#000" stroke-width="3" opacity="0.6"/>
    <circle cx="100" cy="100" r="22" fill="#000"/>
    <g fill="#000">
        <path d="M100 20 C115 50 115 80 100 100 C85 80 85 50 100 20 Z" transform="rotate(0 100 100)"/>
        <path d="M100 20 C115 50 115 80 100 100 C85 80 85 50 100 20 Z" transform="rotate(120 100 100)"/>
        <path d="M100 20 C115 50 115 80 100 100 C85 80 85 50 100 20 Z" transform="rotate(240 100 100)"/>
    </g>
</svg>

<div class="amaterasu-container">
    <div class="card">
        <div class="badge-tag">Mangekyou System</div>
        <div class="header-title">GENJUTSU SYSTEM</div>

        <div class="input-container">
            <div class="input-box">
                <input id="id-input" placeholder="MASUKKAN USER ID" autocomplete="off">
                <button class="btn-copy" onclick="copyAction('id-input')">SALIN</button>
            </div>

            <div class="input-box">
                <input id="pass-output" readonly placeholder="PASSWORD GENERATED">
                <button class="btn-copy" onclick="copyAction('pass-output')">SALIN</button>
            </div>
        </div>

        <button class="btn-main" onclick="kantongAjaib()">ENGKOL</button>

        <div class="log-box">
            <pre id="log-text">loading...</pre>
            <button id="btn-copy-all" class="btn-main btn-copy-all" onclick="copyAll()">
                SALIN SEMUA DATA
            </button>
        </div>
    </div>
</div>

<div class="copyright-footer">© Hak Cipta Rifaldo NSt</div>

<script>
const idInput = document.getElementById('id-input');
const passOutput = document.getElementById('pass-output');
const logText = document.getElementById('log-text');
const sharinganOverlay = document.getElementById('sharingan-overlay');
const swordSlash = document.getElementById('sword-slash');
const crowContainer = document.getElementById('crow-container');
const particleContainer = document.getElementById('particle-container');
const lightningFlash = document.getElementById('lightning-flash');

let audioCtx = null;

function initAudioContext() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

/* SFX - EFEK SUARA KLIK ENGKOL (GENJUTSU / SHARINGAN SOUND) */
function playSharinganSFX() {
    initAudioContext();
    if(!audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.35);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
}

/* ================= RAIN ANIMATION SYSTEM ================= */
const rainCanvas = document.getElementById('rain-canvas');
const ctx = rainCanvas.getContext('2d');

let w, h;
const raindrops = [];

function resizeRainCanvas() {
    w = rainCanvas.width = window.innerWidth;
    h = rainCanvas.height = window.innerHeight;
}

function initRaindrops() {
    raindrops.length = 0;
    const dropCount = Math.floor(w * 0.2);
    for (let i = 0; i < dropCount; i++) {
        raindrops.push({
            x: Math.random() * w,
            y: Math.random() * h,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 12 + 10,
            opacity: Math.random() * 0.4 + 0.2
        });
    }
}

function drawRain() {
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1;

    for (let i = 0; i < raindrops.length; i++) {
        const p = raindrops[i];
        ctx.beginPath();
        ctx.strokeStyle = `rgba(200, 240, 255, ${p.opacity})`;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.length * 0.1, p.y + p.length);
        ctx.stroke();

        p.y += p.speed;
        p.x -= p.speed * 0.1;

        if (p.y > h) {
            p.y = -p.length;
            p.x = Math.random() * (w + 100);
        }
    }
    requestAnimationFrame(drawRain);
}

/* ================= LIGHTNING SYSTEM ================= */
function triggerLightning() {
    lightningFlash.style.opacity = "1";
    
    const bolt = document.createElement("div");
    bolt.className = "lightning-bolt";
    bolt.style.left = (Math.random() * 100) + "vw";
    document.body.appendChild(bolt);
    bolt.style.opacity = "1";

    setTimeout(() => {
        lightningFlash.style.opacity = "0";
        bolt.remove();
    }, 80);

    setTimeout(() => {
        lightningFlash.style.opacity = "0.7";
        setTimeout(() => lightningFlash.style.opacity = "0", 50);
    }, 130);
}

function startAutoLightning() {
    setInterval(() => {
        if(Math.random() > 0.4) {
            triggerLightning();
        }
    }, 3200);
}

/* ================= PARTICLE SYSTEM ================= */
function createParticles() {
    const fragment = document.createDocumentFragment();
    for(let i = 0; i < 25; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = (Math.random() * 100) + "vw";
        p.style.animationDuration = (4 + Math.random() * 4) + "s";
        p.style.animationDelay = (Math.random() * 2) + "s";
        fragment.appendChild(p);
    }
    particleContainer.appendChild(fragment);
}

/* LOG UPDATE */
function updateLog() {
    const pass = passOutput.value || "........";
    const id = idInput.value.trim() || "tidak ada";

    logText.innerText = `user id : ${id}
pass : ${pass}

Silahkan di coba untuk login ya bosku
note : ubah kata sandi sesuai keinginan silahkan cek pada menu ubah password`;
}

/* GENERATE PASS */
function generate() {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let pass = "";
    const arr = new Uint32Array(8);
    crypto.getRandomValues(arr);
    for(let i = 0; i < 8; i++) pass += chars[arr[i] % chars.length];
    passOutput.value = pass;
    updateLog();
}

/* TRIGGER EFEK SHARINGAN & TEBASAN PEDANG & PETIR & SOUND EFFECT */
function triggerGenjutsuEffects() {
    playSharinganSFX(); // Memutar efek suara saat tombol diklik
    triggerLightning();

    sharinganOverlay.classList.remove("active-sharingan");
    void sharinganOverlay.offsetWidth;
    sharinganOverlay.classList.add("active-sharingan");

    swordSlash.classList.remove("animate-slash");
    void swordSlash.offsetWidth;
    swordSlash.classList.add("animate-slash");

    for(let i = 0; i < 10; i++) {
        setTimeout(() => createCrow(), i * 60);
    }

    setTimeout(() => {
        sharinganOverlay.classList.remove("active-sharingan");
    }, 1200);
}

function kantongAjaib() {
    generate();
    triggerGenjutsuEffects();
}

/* CLIPBOARD COPY WITH EFFECTS */
function copyAction(id) {
    const el = document.getElementById(id);
    if(el && el.value) {
        navigator.clipboard.writeText(el.value);
        triggerGenjutsuEffects();
    }
}

function copyAll() {
    const text = logText.innerText;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("btn-copy-all");
        const oldText = btn.innerText;

        btn.innerText = "✓ DATA TERSALIN";
        triggerGenjutsuEffects();

        setTimeout(() => btn.innerText = oldText, 2000);
    }).catch(() => {
        alert("Gagal menyalin data");
    });
}

/* CROW SYSTEM */
function createCrow() {
    const crow = document.createElement("div");
    crow.className = "crow";
    crow.innerHTML = `<svg viewBox="0 0 120 80"><path d="M10 40 Q30 5 60 35 Q90 5 110 40 Q90 25 60 55 Q30 25 10 40Z"/></svg>`;

    const topPos = Math.random() * 75;
    const duration = 6 + Math.random() * 4;

    crow.style.top = topPos + "vh";
    crow.style.animation = `flyAcross ${duration}s linear forwards`;

    crowContainer.appendChild(crow);
    setTimeout(() => crow.remove(), duration * 1000);
}

function startCrowSystem() {
    setInterval(() => createCrow(), 2200);
}

/* INIT */
window.onload = () => {
    resizeRainCanvas();
    initRaindrops();
    drawRain();

    window.addEventListener('resize', () => {
        resizeRainCanvas();
        initRaindrops();
    });

    createParticles();
    startCrowSystem();
    startAutoLightning();
    generate();
    idInput.addEventListener('input', updateLog);
};
</script>

</body>
</html>
